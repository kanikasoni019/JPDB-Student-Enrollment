<!DOCTYPE html>
<html>

<head>
    <title>Student Enrollment Form</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>
</head>

<body>

    <div class="container">

        <h2>Student Enrollment Form</h2>

        <label for="roll">Roll No</label>
        <input type="text" id="roll" placeholder="Enter Roll No">

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name">

        <label for="class">Class</label>
        <input type="text" id="class" placeholder="Enter Class">

        <label for="birth">Birth Date</label>
        <input type="date" id="birth">

        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Enter Address">

        <label for="enroll">Enrollment Date</label>
        <input type="date" id="enroll">

        <div class="btns">
            <button id="save" onclick="saveData()">Save</button>
            <button id="update" onclick="updateData()">Update</button>
            <button id="reset" onclick="resetForm()">Reset</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
