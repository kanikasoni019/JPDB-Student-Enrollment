<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student Enrollment Form</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 3 CSS & jQuery -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    
    <!-- JsonPowerDB Commons JS -->
    <script src="http://login2explore.com/jpdb/resources/js/0.0.8/jpdb-commons.js"></script>
</head>
<body>

<div class="container" style="max-width: 600px; margin-top: 30px;">
    <h2 class="text-center">Student Enrollment Form</h2>

    <form id="studentForm">
        <div class="form-group">
            <label for="roll">Roll No:</label>
            <input type="text" class="form-control" id="roll" placeholder="Enter Roll Number" onchange="getStudent()">
        </div>

        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" class="form-control" id="name" placeholder="Enter Full Name" >
        </div>

        <div class="form-group">
            <label for="class">Class:</label>
            <input type="text" class="form-control" id="class" placeholder="Enter Class" >
        </div>

        <div class="form-group">
            <label for="birth">Birth Date:</label>
            <input type="date" class="form-control" id="birth" >
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <input type="text" class="form-control" id="address" placeholder="Enter Address" >
        </div>

        <div class="form-group">
            <label for="enroll">Enrollment Date:</label>
            <input type="date" class="form-control" id="enroll">
        </div>

        <div class="text-center">
            <button type="button" class="btn btn-primary" id="save" onclick="saveData()" >Save</button>
            <button type="button" class="btn btn-success" id="update" onclick="updateData()" >Update</button>
            <button type="button" class="btn btn-default" id="reset" onclick="resetForm()">Reset</button>
        </div>
    </form>
</div>

<script src="script.js"></script>

</body>
</html>
